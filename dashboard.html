<!DOCTYPE html>

<html>

<head>

<meta charset="utf-8">

<title>Munich Urban Flux Observatory</title>

<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

<style>

body {

    font-family: Arial, sans-serif;
    max-width: 1600px;
    margin: auto;
    padding: 20px;
    background: #f5f5f5;

}

h1 {

    text-align: center;

}

nav {

    background: white;
    padding: 15px;
    margin-bottom: 20px;
    border-radius: 5px;

}

nav a {

    margin-right: 20px;
    text-decoration: none;
    font-weight: bold;
    color: #0066cc;

}

#current {

    background: white;
    padding: 15px;
    margin-bottom: 20px;
    border-radius: 5px;

}

.dashboard-grid {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 20px;

}

.plot-panel {

    background: white;
    padding: 10px;
    border-radius: 5px;
    height: 450px;

}

@media only screen and (max-width: 900px) {

.dashboard-grid {

    grid-template-columns: 1fr;

}

}

</style>

</head>

<body>

<nav>

<a href="index.html">Home</a>

<a href="dashboard.html">Data Dashboard</a>

</nav>

<h1>Munich Urban Flux Observatory</h1>

<div id="current">

<h2>Current Conditions</h2>

<p id="latest"></p>

</div>

<div class="dashboard-grid">

<div id="co2plot" class="plot-panel"></div>

<div id="hplot" class="plot-panel"></div>

<div id="leplot" class="plot-panel"></div>

<div id="wsplot" class="plot-panel"></div>

<div id="wdplot" class="plot-panel"></div>

<div id="taplot" class="plot-panel"></div>

</div>

<script>

fetch('data/FluxDashboard.csv')

.then(response => response.text())

.then(data => {

    let rows = data.trim().split('\n');

    let time = [];

    let co2 = [];

    let H = [];

    let LE = [];

    let ws = [];

    let wd = [];

    let Ta = [];

    for(let i=1;i<rows.length;i++){

        let cols = rows[i].split(',');

        time.push(cols[0]);

        co2.push(Number(cols[1]));

        H.push(Number(cols[2]));

        LE.push(Number(cols[3]));

        ws.push(Number(cols[4]));

        wd.push(Number(cols[5]));

        Ta.push(Number(cols[6]));

    }

    let n = time.length - 1;

    document.getElementById("latest").innerHTML =
    "<b>Time:</b> " + time[n] +
    "<br><b>CO₂ Flux:</b> " + co2[n].toFixed(2) + " μmol m⁻² s⁻¹" +
    "<br><b>H:</b> " + H[n].toFixed(1) + " W m⁻²" +
    "<br><b>LE:</b> " + LE[n].toFixed(1) + " W m⁻²" +
    "<br><b>Wind Speed:</b> " + ws[n].toFixed(2) + " m s⁻¹" +
    "<br><b>Wind Direction:</b> " + wd[n].toFixed(0) + "°" +
    "<br><b>Air Temperature:</b> " + Ta[n].toFixed(2) + " K";

    Plotly.newPlot(
        'co2plot',
        [{
            x: time,
            y: co2,
            mode: 'lines'
        }],
        {
            title:'CO₂ Flux (μmol m⁻² s⁻¹)'
        }
    );

    Plotly.newPlot(
        'hplot',
        [{
            x: time,
            y: H,
            mode: 'lines'
        }],
        {
            title:'Sensible Heat Flux H (W m⁻²)'
        }
    );

    Plotly.newPlot(
        'leplot',
        [{
            x: time,
            y: LE,
            mode: 'lines'
        }],
        {
            title:'Latent Heat Flux LE (W m⁻²)'
        }
    );

    Plotly.newPlot(
        'wsplot',
        [{
            x: time,
            y: ws,
            mode: 'lines'
        }],
        {
            title:'Wind Speed (m s⁻¹)'
        }
    );

    Plotly.newPlot(
        'wdplot',
        [{
            x: time,
            y: wd,
            mode: 'lines'
        }],
        {
            title:'Wind Direction (°)'
        }
    );

    Plotly.newPlot(
        'taplot',
        [{
            x: time,
            y: Ta,
            mode: 'lines'
        }],
        {
            title:'Air Temperature (K)'
        }
    );

});

</script>

</body>

</html>
