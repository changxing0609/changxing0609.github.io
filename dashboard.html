<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<title>Real-Time Eddy Covariance Measurements</title>

<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

</head>

<body>

<nav>
    <a href="index.html">Home</a>
    <a href="dashboard.html">Data Dashboard</a>
</nav>

<h1>Real-Time Eddy Covariance Measurements</h1>

<p class="subtitle">
30-minute eddy covariance measurements automatically processed from 20-Hz observations
</p>

<div class="dashboard-grid">

    <div id="co2plot" class="plot-panel"></div>

    <div id="hplot" class="plot-panel"></div>

    <div id="leplot" class="plot-panel"></div>

    <div id="wsplot" class="plot-panel"></div>

    <div id="wdplot" class="plot-panel"></div>

    <div id="taplot" class="plot-panel"></div>

</div>

<script>

fetch("data/FluxDashboard.csv")

.then(response => response.text())

.then(text => {

    let rows = text.trim().split("\n");

    let time = [];
    let co2 = [];
    let H = [];
    let LE = [];
    let ws = [];
    let wd = [];
    let Ta = [];

    for(let i=1;i<rows.length;i++){

        let c = rows[i].trim().split(",");

        if(c.length < 7) continue;

        time.push(c[0]);

        co2.push(parseFloat(c[1]));

        H.push(parseFloat(c[2]));

        LE.push(parseFloat(c[3]));

        ws.push(parseFloat(c[4]));

        wd.push(parseFloat(c[5]));

        Ta.push(parseFloat(c[6]));

    }

    Plotly.newPlot(
        "co2plot",
        [{
            x: time,
            y: co2,
            mode: "lines",
            name: "CO₂ Flux"
        }],
        {
            title: "CO₂ Flux (μmol m⁻² s⁻¹)",
            xaxis: {title: "Time"},
            yaxis: {title: "CO₂ Flux"}
        }
    );

    Plotly.newPlot(
        "hplot",
        [{
            x: time,
            y: H,
            mode: "lines",
            name: "H"
        }],
        {
            title: "Sensible Heat Flux H (W m⁻²)",
            xaxis: {title: "Time"},
            yaxis: {title: "H"}
        }
    );

    Plotly.newPlot(
        "leplot",
        [{
            x: time,
            y: LE,
            mode: "lines",
            name: "LE"
        }],
        {
            title: "Latent Heat Flux LE (W m⁻²)",
            xaxis: {title: "Time"},
            yaxis: {title: "LE"}
        }
    );

    Plotly.newPlot(
        "wsplot",
        [{
            x: time,
            y: ws,
            mode: "lines",
            name: "Wind Speed"
        }],
        {
            title: "Wind Speed (m s⁻¹)",
            xaxis: {title: "Time"},
            yaxis: {title: "Wind Speed"}
        }
    );

    Plotly.newPlot(
        "wdplot",
        [{
            x: time,
            y: wd,
            mode: "lines",
            name: "Wind Direction"
        }],
        {
            title: "Wind Direction (°)",
            xaxis: {title: "Time"},
            yaxis: {title: "Direction"}
        }
    );

    Plotly.newPlot(
        "taplot",
        [{
            x: time,
            y: Ta,
            mode: "lines",
            name: "Temperature"
        }],
        {
            title: "Air Temperature (°C)",
            xaxis: {title: "Time"},
            yaxis: {title: "Temperature"}
        }
    );

})

.catch(error => {

    console.error(error);

    document.body.innerHTML +=
    "<h2 style='color:red;'>Failed to load FluxDashboard.csv</h2>";

});

</script>

</body>

</html>
